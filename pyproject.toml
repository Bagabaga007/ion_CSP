[build-system]
requires = ["setuptools>=83,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ion_CSP"
version = "2.3.5"
keywords = ["Ion_Crystal, Crystal_Structure_Prediction"]
authors = [
    {name = "Ze Yang", email = "yangze1995007@163.com"}
]
description = "Crystal Structure Design Software Based on Molecular/Ionic Configuration."
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "ase==3.23.0",
    "scipy==1.15.2",
    "dpdispatcher>=1.1,<2",
    "numpy==1.26.4",
    "networkx>=3.0",
    "pandas==2.2.3",
    "paramiko>=5,<6",
    "psutil==7.0.0",
    "pyxtal==1.0.4",
    "PyYAML==6.0.2",
    "phonopy==2.34.1",
    "rdkit==2024.3.3",
    "cryptography>=50,<51",
    "filelock>=3.20.3,<4",
    "fonttools>=4.60.2,<5",
    "idna>=3.15,<4",
    "lxml>=6.1,<7",
    "matplotlib>=3.10,<4",
    "pillow>=12.3,<13",
    "Pygments>=2.20,<3",
    "pymatgen>=2025.10.7,<2027",
    "PyNaCl>=1.6.2,<2",
    "requests>=2.33,<3",
    "urllib3>=2.7,<3"
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ion_CSP*"]
namespaces = true

[tool.setuptools.package-data]
ion_CSP = ["param/*", "model/*.pt", "model/options/*"]

[project.scripts]
ion-csp = "ion_CSP.task_manager:main"

[tool.pytest.ini_options]
# 注意：不要把 --cov 放进 addopts，否则会破坏 VS Code/Trae 的测试发现与调试
# （pytest-cov 与 IDE 测试适配器都依赖 sys.settrace，二者冲突）。
# 需要覆盖率时显式运行：
#   pytest --cov=src/ion_CSP --cov-branch --cov-report=html --cov-report=term-missing
addopts = [
    "--tb=short",
    "-v",
]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (moderate speed)",
    "ci: Configuration Item tests (black-box testing)",
    "system: System tests (slow, end-to-end)",
    "slow: Slow running tests",
]
testpaths = ["tests"]
