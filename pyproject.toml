[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ion_CSP"
dynamic = ["version"]
keywords = ["Ion_Crystal, Crystal_Structure_Prediction"]
authors = [
    {name = "Ze Yang", email = "yangze1995007@163.com"}
]
description = "Crystal Structure Design Software Based on Molecular/Ionic Configuration."
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "ase==3.23.0",
    "scipy==1.15.2",
    "deepmd-kit==3.0.1",
    "torch==2.5.0",
    "dpdispatcher==0.6.7",
    "numpy==1.26.4",
    "paramiko==3.5.1",
    "pyxtal==1.0.4",
    "phonopy==2.34.1",
    "rdkit==2024.3.3",
    "pytest==8.3.4",
    "pytest-cov==6.2.1"
]

[tool.setuptools]
packages = ["ion_CSP", "ion_CSP.run"]
package-dir = {"" = "src"}

[tool.setuptools_scm]

[project.scripts]
ion-csp = "ion_CSP.task_manager:main"

[tool.pytest.ini_options]
# 注意：不要把 --cov 放进 addopts，否则会破坏 VS Code/Trae 的测试发现与调试
# （pytest-cov 与 IDE 测试适配器都依赖 sys.settrace，二者冲突）。
# 需要覆盖率时显式运行：
#   pytest --cov=src/ion_CSP --cov-branch --cov-report=html --cov-report=term-missing
addopts = [
    "--tb=short",
    "-v",
]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (moderate speed)",
    "ci: Configuration Item tests (black-box testing)",
    "system: System tests (slow, end-to-end)",
    "slow: Slow running tests",
]
testpaths = ["tests"]
