name: Conda Environment Build

on:
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
    permissions: 
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Set up conda
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-activate-base: false
        channels: conda-forge,defaults

    - name: Create environment
      run: |
        conda env create -f environment.yml --name ion-csp-env

    - name: Install build tooling
      run: |
        conda run --name ion-csp-env python -m pip install --upgrade build "uv==0.11.33"

    - name: Verify dependency lock
      run: |
        conda run --name ion-csp-env uv lock --check

    - name: Build package
      run: |
        conda run --name ion-csp-env python -m build
        conda run --name ion-csp-env pip install -e ".[test]"
  
    - name: Test with pytest
      run: |
        conda run --name ion-csp-env pytest
